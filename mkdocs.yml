# Gerado por fernando-moretes/platform (TechDocs do Backstage). O conteudo e do
# repositorio: escreva em docs/*.md; este arquivo so lista as paginas.
site_name: ref-aws-architecture-studio
site_description: "AWS Architecture Studio: ADR wizard with live preview, Mermaid diagram builder, reference patterns and AWS service catalog."
repo_url: https://github.com/fernando-moretes/ref-aws-architecture-studio
edit_uri: edit/main/docs/
docs_dir: docs
plugins:
  - techdocs-core
nav:
  - Visão geral: index.md
  - Arquitetura: arquitetura.md
  - Operação: operacao.md
  - API: api.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
